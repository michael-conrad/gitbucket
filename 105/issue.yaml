  | Source | Type | Location | Verification |

  |--------|------|----------|--------------|

  | GitHub Actions workflow syntax — `jobs.<job_id>.container` | official docs | https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idcontainer
  | fetched live 2026-09-24 |

  | `gh workflow run` / `gh run view` / `gh issue list` | CLI docs | https://cli.github.com/manual/
  | commands available in environment (`gh` authenticated, live-verified) |

  | `.github/workflows/upstream-release-watch.yml` | repository file | repo root |
  read live 2026-09-24 (step-level `container:`/`entrypoint:` confirmed present) |

  | `test/test_workflow_jobs.py` | repository file | repo root | read live 2026-09-24
  (SC-4 test currently asserts the invalid step-level shape — must be rewritten) |

  | `scripts/release-watch.py` | repository file | repo root | read live 2026-09-24
  (`run_release_watch()`, `search_issue_exists()`, state-file write confirmed) |

  | HTTP 422 dispatch failure evidence | artifact | `tmp/103/artifacts/phase2-sc5-live-dispatch.yaml`
  | live dispatch on dev recorded 2026-09-24 |


  ## Affected Files


  - `.github/workflows/upstream-release-watch.yml`

  - `test/test_workflow_jobs.py`


