issue_number: 101
artifact: state-analysis
states: ["idle", "running", "skipped(upstream-down)", "filed", "dupe-skipped"]
transitions:
  - from: "idle"
    to: "running"
    on: "weekly trigger"
  - from: "running"
    to: "skipped(upstream-down)"
    on: "fetch failure (state unchanged)"
  - from: "running"
    to: "filed"
    on: "new release TAGS filed + last-seen TAG advanced (TAG value only, never commit SHA)"
  - from: "running"
    to: "dupe-skipped"
    on: "no new tags (state unchanged)"
  - from: "filed"
    to: "idle"
    on: "run complete"
variables:
  # Completed-state snapshot derived from the state machine above: the full
  # run cycle (idle -> running -> filed -> idle) requires all four pipeline
  # phases complete. Consumed by `solve check` against dependency-contract.yaml.
  phase1_workflow_skeleton: true
  phase2_detection: true
  phase3_filing: true
  phase4_state: true
