# Weekly upstream-release watch — .issues/101 SC-1, SC-2
# Container and job steps are added by later SCs.

name: upstream-release-watch

on:
  schedule:
    # Weekly: 04:23 UTC every Monday (POSIX cron, 5 fields).
    - cron: "23 4 * * 1"
  workflow_dispatch:

# SC-2: serialize overlapping runs — at most one run of this group executes
# at any time; overlapping triggers pend (cancel-in-progress defaults to false).
concurrency:
  group: upstream-release-watch

jobs:
  release-watch:
    runs-on: ubuntu-latest
    # SC-3 (.issues/103): minimal permissions — exactly issues: write and
    # contents: write, no broader scopes.
    permissions:
      issues: write
      contents: write
    steps:
      # SC-2 (.issues/103): check out the repository before invoking the script.
      - uses: actions/checkout@v4
      # SC-4 (.issues/103): invoke the pipeline script inside the pinned uv
      # container image (FR-3, NFR-1).
      - name: Run release-watch pipeline
        container:
          image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
          entrypoint: uv run scripts/release-watch.py

